<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星鉴 · 企业信息查询</title>
  <meta name="description" content="星鉴 —— 企业信息查询，一站式公开信息调研。">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-KYLJsqEQ.svg">
  <link rel="stylesheet" crossorigin href="/assets/index-D55CbmCs.css">
</head>
<body>
  <div class="app">

    <!-- 头部品牌区 -->
    <header class="masthead">
      <div class="masthead__brand">
        <img class="brand__logo" src="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%20width='64'%20height='64'%20role='img'%20aria-label='星鉴'%3e%3cdefs%3e%3clinearGradient%20id='xj-bg'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3e%3cstop%20offset='0'%20stop-color='%233D6BFF'/%3e%3cstop%20offset='0.55'%20stop-color='%235B4DF5'/%3e%3cstop%20offset='1'%20stop-color='%237A3DF0'/%3e%3c/linearGradient%3e%3clinearGradient%20id='xj-star'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3e%3cstop%20offset='0'%20stop-color='%23FFE48A'/%3e%3cstop%20offset='1'%20stop-color='%23FFA62E'/%3e%3c/linearGradient%3e%3clinearGradient%20id='xj-lens'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3e%3cstop%20offset='0'%20stop-color='%23FFFFFF'%20stop-opacity='0.24'/%3e%3cstop%20offset='1'%20stop-color='%23FFFFFF'%20stop-opacity='0.05'/%3e%3c/linearGradient%3e%3c/defs%3e%3c!--%20圆角方形徽章%20--%3e%3crect%20x='1.5'%20y='1.5'%20width='61'%20height='61'%20rx='15.5'%20fill='url(%23xj-bg)'/%3e%3c!--%20顶部高光%20--%3e%3cpath%20d='M17%201.5%20H47%20A15.5%2015.5%200%200%201%2062.5%2017%20V30%20H1.5%20V17%20A15.5%2015.5%200%200%201%2017%201.5%20Z'%20fill='%23FFFFFF'%20opacity='0.08'/%3e%3c!--%20放大镜镜片%20--%3e%3ccircle%20cx='28.5'%20cy='28.5'%20r='15'%20fill='url(%23xj-lens)'%20stroke='%23FFFFFF'%20stroke-width='3.2'/%3e%3c!--%20五角星（星）%20--%3e%3cpath%20d='M28.5%2018%20L30.745%2024.91%20L38.011%2024.91%20L32.133%2029.18%20L34.378%2036.09%20L28.5%2031.82%20L22.622%2036.09%20L24.867%2029.18%20L18.989%2024.91%20L26.255%2024.91%20Z'%20fill='url(%23xj-star)'/%3e%3c!--%20放大镜手柄%20--%3e%3cline%20x1='39.5'%20y1='39.5'%20x2='50.5'%20y2='50.5'%20stroke='%23FFFFFF'%20stroke-width='5'%20stroke-linecap='round'/%3e%3c!--%20右上角点缀星%20--%3e%3cpath%20d='M49.5%2013.5%20L50.4%2016.6%20L53.5%2017.5%20L50.4%2018.4%20L49.5%2021.5%20L48.6%2018.4%20L45.5%2017.5%20L48.6%2016.6%20Z'%20fill='%23FFE48A'/%3e%3c/svg%3e" alt="星鉴 Logo" width="44" height="44">
        <div class="brand__text">
          <h1 class="brand__name">星鉴</h1>
          <p class="brand__slogan">企业信息查询 · 一站式公开信息调研</p>
        </div>
      </div>
    </header>

    <!-- 搜索区 -->
    <section class="search">
      <form id="search-form" class="search__form" autocomplete="off" role="search">
        <svg class="search__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search-input" class="search__input" type="text" maxlength="80"
               placeholder="输入企业名称，如：深圳市腾讯计算机系统有限公司" aria-label="企业名称">
        <button class="search__btn" type="submit">查询</button>
      </form>
      <div class="search__chips" id="chips">
        <span class="chips__label">试试：</span>
        <button class="chip" type="button" data-q="腾讯">腾讯</button>
        <button class="chip" type="button" data-q="华为">华为</button>
        <button class="chip" type="button" data-q="字节跳动">字节跳动</button>
        <button class="chip" type="button" data-q="比亚迪">比亚迪</button>
      </div>
    </section>

    <!-- 结果区 -->
    <main class="stage" id="stage">

      <!-- 空状态 -->
      <div class="state" id="state-empty">
        <div class="state__icon">
          <svg viewBox="0 0 64 64" width="88" height="88" aria-hidden="true">
            <circle cx="27" cy="27" r="16" fill="none" stroke="#c3cbd9" stroke-width="3"/>
            <line x1="39" y1="39" x2="51" y2="51" stroke="#c3cbd9" stroke-width="4" stroke-linecap="round"/>
            <path d="M27 18 L29.5 23.9 L35.9 24.8 L31 29.4 L32.2 35.8 L27 33.1 L21.8 35.8 L23 29.4 L18.1 24.8 L24.5 23.9 Z" fill="#d5dbe8"/>
          </svg>
        </div>
        <p class="state__title">输入企业名称，开始调研</p>
        <p class="state__desc">星鉴将自动检索公开网络信息，并整理成一份调研结果。</p>
      </div>

      <!-- 加载状态 -->
      <div class="state" id="state-loading" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p class="state__title" id="loading-text">正在检索公开信息…</p>
        <p class="state__desc">首次查询可能需要稍等片刻</p>
      </div>

      <!-- 错误状态 -->
      <div class="state state--error" id="state-error" hidden>
        <div class="state__icon">
          <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
            <circle cx="32" cy="32" r="26" fill="none" stroke="#f2c2c2" stroke-width="3"/>
            <line x1="32" y1="18" x2="32" y2="36" stroke="#e06c6c" stroke-width="4" stroke-linecap="round"/>
            <circle cx="32" cy="45" r="2.6" fill="#e06c6c"/>
          </svg>
        </div>
        <p class="state__title">查询失败</p>
        <p class="state__desc" id="error-text"></p>
      </div>

      <!-- 结果大框 -->
      <div class="result-box" id="result-box" hidden>
        <div class="result-box__bar">
          <span class="result-box__label">调研结果</span>
          <button class="result-box__copy" id="btn-copy" type="button">复制</button>
        </div>
        <div class="markdown" id="report"></div>
      </div>

    </main>

    <footer class="foot">
      <p>仅查询合法公开信息 · 结果仅用于前期快速调研，不构成尽调或法律依据</p>
    </footer>
  </div>

  <script src="js/app.js?v=4"></script>
</body>
</html>
