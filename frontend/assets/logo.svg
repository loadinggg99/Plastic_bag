<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="星鉴">
  <defs>
    <linearGradient id="xj-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D6BFF"/>
      <stop offset="0.55" stop-color="#5B4DF5"/>
      <stop offset="1" stop-color="#7A3DF0"/>
    </linearGradient>
    <linearGradient id="xj-star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE48A"/>
      <stop offset="1" stop-color="#FFA62E"/>
    </linearGradient>
    <linearGradient id="xj-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形徽章 -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15.5" fill="url(#xj-bg)"/>
  <!-- 顶部高光 -->
  <path d="M17 1.5 H47 A15.5 15.5 0 0 1 62.5 17 V30 H1.5 V17 A15.5 15.5 0 0 1 17 1.5 Z" fill="#FFFFFF" opacity="0.08"/>

  <!-- 放大镜镜片 -->
  <circle cx="28.5" cy="28.5" r="15" fill="url(#xj-lens)" stroke="#FFFFFF" stroke-width="3.2"/>

  <!-- 五角星（星） -->
  <path d="M28.5 18 L30.745 24.91 L38.011 24.91 L32.133 29.18 L34.378 36.09 L28.5 31.82 L22.622 36.09 L24.867 29.18 L18.989 24.91 L26.255 24.91 Z" fill="url(#xj-star)"/>

  <!-- 放大镜手柄 -->
  <line x1="39.5" y1="39.5" x2="50.5" y2="50.5" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- 右上角点缀星 -->
  <path d="M49.5 13.5 L50.4 16.6 L53.5 17.5 L50.4 18.4 L49.5 21.5 L48.6 18.4 L45.5 17.5 L48.6 16.6 Z" fill="#FFE48A"/>
</svg>
