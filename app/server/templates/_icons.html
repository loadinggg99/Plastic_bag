{% macro icon(icon_markup, size=20, class_name="domain-card__icon") -%}

     fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ icon_markup }}</svg>
{%- endmacro %}
