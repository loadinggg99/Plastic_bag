{% extends "base.html" %}

{% block title %}{{ error_title }} · {{ site_name }}{% endblock %}

{% block main %}
<main class="error-page">
  <div class="error-page__card">
    <h1>{{ error_title }}</h1>
    <p>{{ error_message }}</p>
    <a class="btn-primary" href="{{ back_url }}">{{ back_label }}</a>
  </div>
</main>
{% endblock %}
