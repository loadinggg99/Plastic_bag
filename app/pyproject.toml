[project]
# app/ 就是后端项目根：.venv / uv.lock / .env / langgraph.json 都在这一层。
# 没有 [build-system]，uv 按虚拟项目处理（不打包、不装 console script），
# 依赖仍然全部由 uv.lock 锁定。
name = "star_identification"
version = "0.1.0"
description = "基于 LangGraph + Tavily + DeepSeek 的企业调研 Agent 后端"
authors = [
    { name = "signal_lost", email = "ryc2_7182818@163.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.148.0",
    "jinja2>=3.1.6",
    "langchain-openai>=1.7.1",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langgraph-cli[inmem]>=0.4.35",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.19.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.fastapi]
entrypoint = "server.main:app"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
